name: qa-eval

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: qa
      POSTGRES_PASSWORD: qa
      POSTGRES_DB: qa
    command:
      - postgres
      - -c
      - wal_level=logical
    ports: ["55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa -d qa"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ["56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,OUTSIDE://localhost:59092
    ports:
      - "59092:9092"
      - "58081:8081"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 3s
      timeout: 5s
      retries: 40

  app:
    build: .
    environment:
      POSTGRES_DSN: postgresql+asyncpg://qa:qa@postgres:5432/qa
      REDIS_DSN: redis://redis:6379/0
      KAFKA_BOOTSTRAP: redpanda:29092
      SCHEMA_REGISTRY: http://redpanda:8081
      SCHEMA_DOC_MODE: "${SCHEMA_DOC_MODE:-false}"
      SKIP_BEFORE_IMAGE: "${SKIP_BEFORE_IMAGE:-false}"
      MIRROR_AFTER_COMMIT: "${MIRROR_AFTER_COMMIT:-false}"
      CACHE_INCR: "${CACHE_INCR:-false}"
      SEAL_ON_CLOCK: "${SEAL_ON_CLOCK:-false}"
      DEMO_HEALTH_BUG: "${DEMO_HEALTH_BUG:-false}"
    ports: ["58000:8000"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      redpanda: {condition: service_healthy}
